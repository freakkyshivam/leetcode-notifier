<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>log in — leetcode-notifier</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="wrap">
  <p class="prompt">./login</p>
  <h1>Log in</h1>
  <p class="sub">Enter your email address to receive a secure 6-digit OTP code.</p>

  <!-- STEP 1: Enter Email -->
  <div class="panel" id="step1-panel">
    <p class="panel-title">Your Registered Email</p>
    <label for="email">Email address</label>
    <input type="email" id="email" placeholder="you@example.com" required />
    <div style="margin-top: 16px;">
      <button id="btn-send-otp">Send Verification OTP →</button>
    </div>
  </div>

  <!-- STEP 2: Enter 6-digit OTP -->
  <div class="panel" id="step2-panel" style="display: none;">
    <p class="panel-title">Enter Verification Code</p>
    <p class="hint" style="margin-bottom: 12px; color: var(--ok);">We've sent a 6-digit verification code to <span id="sent-email-display" style="font-weight:bold;"></span></p>
    
    <label for="otpCode">6-Digit OTP Code</label>
    <input type="text" id="otpCode" placeholder="123456" maxlength="6" style="letter-spacing: 0.3em; font-size: 18px; font-weight: bold; width: 200px;" />
    
    <div style="margin-top: 16px;">
      <button id="btn-verify-otp">Verify OTP & Log In →</button>
      <button id="btn-resend" style="border-color: var(--line); color: var(--dim);">Resend Code</button>
    </div>
  </div>

  <div class="log" id="log"></div>

  <div style="margin-top: 24px; font-size: 12px; color: var(--dim);">
    Don't have an account yet? <a href="/signup.html">Sign up here</a>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const log = (msg, cls) => {
    const el = $("log");
    el.textContent = msg;
    el.className = "log" + (cls ? " " + cls : "");
  };

  let userEmail = "";

  $("btn-send-otp").addEventListener("click", async () => {
    userEmail = $("email").value.trim();
    if (!userEmail || !userEmail.includes("@")) {
      return log("Please enter a valid email address.", "err");
    }

    $("btn-send-otp").disabled = true;
    log("Sending 6-digit OTP code…");

    try {
      const res = await fetch("/api/auth/send-otp", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: userEmail, mode: "login" }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed to send OTP");

      $("sent-email-display").textContent = userEmail;
      $("step1-panel").style.display = "none";
      $("step2-panel").style.display = "block";
      log("OTP sent! Please check your inbox.", "good");
    } catch (err) {
      log(err.message, "err");
      $("btn-send-otp").disabled = false;
    }
  });

  $("btn-verify-otp").addEventListener("click", async () => {
    const otpCode = $("otpCode").value.trim();
    if (!otpCode || otpCode.length !== 6) {
      return log("Please enter a 6-digit numeric OTP code.", "err");
    }

    $("btn-verify-otp").disabled = true;
    log("Verifying code…");

    try {
      const res = await fetch("/api/auth/verify-otp", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: userEmail, otpCode }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Verification failed");

      localStorage.setItem("leetcode-notifier-user-id", data.user.id);
      log("Verified! Taking you to your dashboard…", "good");
      window.location.href = data.dashboardUrl;
    } catch (err) {
      log(err.message, "err");
      $("btn-verify-otp").disabled = false;
    }
  });

  $("btn-resend").addEventListener("click", () => {
    $("step2-panel").style.display = "none";
    $("step1-panel").style.display = "block";
    $("btn-send-otp").disabled = false;
    log("");
  });
</script>
</body>
</html>
